<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <input
            type="text"
            id="search"
            placeholder="Search users..."
        >

        <div id="cards" class="cards-container">

            <!-- User Card -->
            <div class="card">
                <img
                    src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=500"
                    class="bg-img"
                    alt="user"
                >

                <div class="blurred-layer"></div>

                <div class="content">
                    <h3>Amisha Rathore</h3>
                    <p>Silent chaos in a loud world 🌧️</p>
                </div>
            </div>

            <div class="card">
                <img
                    src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=500"
                    class="bg-img"
                    alt="user"
                >

                <div class="blurred-layer"></div>

                <div class="content">
                    <h3>Kiara Mehta</h3>
                    <p>Main character energy 🎬</p>
                </div>
            </div>

            <div class="card">
                <img
                    src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=500"
                    class="bg-img"
                    alt="user"
                >

                <div class="blurred-layer"></div>

                <div class="content">
                    <h3>Rahul Sharma</h3>
                    <p>Coding by day 💻</p>
                </div>
            </div>

        </div>

    </div>
  <script src="script.js"></script>
</body>
</html>
